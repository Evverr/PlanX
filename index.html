<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>PlanX</title>
    <!-- Till the app is up (its script is big on a slow line): the name on the board's colour, and a
         thin bar running under it. React puts the board in its place. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #ECEEF2; font: 700 28px/1 -apple-system, system-ui, sans-serif; color: #1B2130; }
      .boot b { display: block; letter-spacing: -0.01em; }
      .boot i { display: block; width: 72px; height: 3px; margin: 14px auto 0; border-radius: 2px; background: rgba(27, 33, 48, .1); overflow: hidden; position: relative; }
      .boot i::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #3E7BFA; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: dark) { .boot { background: #14171C; color: #E7EAF0; } .boot i { background: rgba(231, 234, 240, .12); } }
      :root[data-theme="light"] .boot { background: #ECEEF2; color: #1B2130; }
      :root[data-theme="dark"] .boot { background: #14171C; color: #E7EAF0; }
    </style>
    <script>try { var t = localStorage.getItem('planx-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Загрузка"><div><b>Plan</b><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
